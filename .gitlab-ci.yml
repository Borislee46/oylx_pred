stages:
  - lint
  - test

image: dir.staff.xdf.cn/xone-env/python:3.12

before_script:
  - python -m pip install -U pip
  - pip install -U ruff black mypy pytest pytest-cov

lint:
  stage: lint
  script:
    - ruff .
    - black --check .
    - mypy src

test:
  stage: test
  script:
    - pytest -q --maxfail=1 --disable-warnings --cov=src --cov-report=term-missing

