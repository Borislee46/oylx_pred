  hyo:
    - { pillar: 产品研发, label: 产品适配度,   scoring: { type: likert, opinion_max: 2, pairs: [[Q4__1, Q4__1__open2]] } }
    - { pillar: 产品研发, label: 市场认可度,   scoring: { type: likert, opinion_max: 2, pairs: [[Q5__1, Q5__1__open2]] } }
    - { pillar: 产品推广, label: 产品培训,     scoring: { type: ordinal_low_good, cols: [Q6] } }
    - { pillar: 产品服务, label: 产品迭代更新, scoring: { type: ordinal_low_good, cols: [Q7] } }
    - { pillar: 产品服务, label: 响应及时性,   scoring: { type: ordinal_low_good, cols: [Q13] } }

