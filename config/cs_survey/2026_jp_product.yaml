themes:
  opinion:
    default: 其他
    rules:
      - { theme: 价格高风险,         any_of: [[价格], [定价], [贵], [费用], [涨价], [成本], [划算]] }
      - { theme: 预警需提升,         any_of: [[预警], [风险预警], [风险提示]] }
      - { theme: 产品迭代更新需提升, any_of: [[迭代], [更新], [升级], [优化]] }
      - { theme: 产品核验需提升,     any_of: [[核验], [核实], [真实], [准确]] }
      - { theme: 解决能力有待提升,   any_of: [[解决], [投诉], [处理]] }
      - { theme: 宣传材料少,         any_of: [[宣传材料], [宣传册], [物料], [宣传, 材料], [资料, 少]] }
      - { theme: 认可度需提升,       any_of: [[认可], [口碑], [接受度], [接受]] }
      - { theme: 服务需提升,         any_of: [[服务], [客服], [支持], [响应]] }
  praise:
    default: 其他
    rules:
      - { theme: 适配度符合,         any_of: [[适配], [符合], [匹配], [贴合]] }
      - { theme: 培训到位,           any_of: [[培训], [到位], [讲解], [授课], [充分]] }
      - { theme: 背景核验真实准确,   any_of: [[核验], [真实], [准确], [背景, 核验]] }
      - { theme: 响应及时,           any_of: [[响应], [及时]] }
      - { theme: 认可度较高,         any_of: [[认可], [口碑], [满意], [好评]] }
      - { theme: 推广支持全面,       any_of: [[推广], [支持], [全面], [宣传], [材料], [方案]] }
      - { theme: 能有效解决问题,     any_of: [[解决, 问题], [解决, 有效], [解决, 投诉], [解决, 处理]] }
      - { theme: 有迭代更新,         any_of: [[迭代], [更新], [优化], [升级]] }

views:
  - { type: overview,          key: overview,   label: 概览 }
  - { type: matrix_by_product, key: by_product, label: 产品视角 }
  - { type: matrix_by_pillar,  key: by_pillar,  label: 维度视角 }
