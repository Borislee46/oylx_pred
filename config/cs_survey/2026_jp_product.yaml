id: 2026_jp_product
title: 2026 日本产品调研报告
subtitle: Customer Survey · Japan Product Insights
updated_at: "2024-03-20"

sources:
  - id: ryu
    label: 日本留学
    dim1_short: 留学
    path: data/cs_survey/2026_jp_product/ryu_wide.csv
  - id: hyo
    label: 日语标化
    dim1_short: 标化
    path: data/cs_survey/2026_jp_product/hyo_wide.csv

cross_filters:
  center:
    column: Q1_分中心
    all_label: 全部
    label: 分中心

pillars:
  - name: 产品研发
    scoring:
      ryu:
        type: likert
        opinion_max: 2
        pairs:
          - [Q2__1, Q2__1__open2]
          - [Q5__1, Q5__1__open2]
      hyo:
        type: likert
        opinion_max: 2
        pairs:
          - [Q4__1, Q4__1__open2]
          - [Q5__1, Q5__1__open2]
  - name: 产品推广
    scoring:
      ryu:
        type: likert
        opinion_max: 2
        pairs:
          - [Q6__1, Q6__1__open2]
          - [Q7__1, Q7__1__open2]
          - [Q8__1, Q8__1__open2]
      hyo:
        type: ordinal_low_good
        cols: [Q6]
  - name: 产品服务
    scoring:
      ryu:
        type: likert
        opinion_max: 2
        pairs:
          - [Q9__1, Q9__1__open2]
          - [Q10__1, Q10__1__open2]
          - [Q11__1, Q11__1__open2]
          - [Q12__1, Q12__1__open2]
      hyo:
        type: ordinal_low_good
        cols: [Q7, Q13]

products:
  ryu:
    type: q_multi_items
    base: Q13
    opinion_max: 3
    items:
      1: EJU总部线上课程
      2: EJU总部中期plus
      3: 学部直达计划
      4: 前途塾素养课程（梦/日出/向日葵）
      5: 前途塾境外课程
      6: EJU香港考团
      7: 大学院日文研究生精英计划
      8: 大学院日文直申
      9: SGU英文授课本科留学服务
      10: SGU英文授课大学院留学服务
      11: 前途塾-大学院高端学术课程
  hyo:
    type: coded_pair_praise_suggestion
    pairs:
      - { label: 志高, code: Q9__1,  text: Q9__2 }
      - { label: 致远, code: Q10__1, text: Q10__2 }
      - { label: 稚趣, code: Q11__1, text: Q11__2 }
      - { label: 挚爱, code: Q12__1, text: Q12__2 }

score_cols:
  ryu:
    mode: raw
    cols: [Q13__1, Q13__2, Q13__3, Q13__4, Q13__5, Q13__6, Q13__7, Q13__8, Q13__9, Q13__10, Q13__11, Q2__1, Q5__1, Q6__1, Q7__1, Q8__1, Q9__1, Q10__1, Q11__1, Q12__1]
  hyo:
    mode: split
    raw: [Q4__1, Q5__1]
    reverse: [Q6, Q7, Q13]

score_distribution_cols:
  ryu: [Q13__1, Q13__2, Q13__3, Q13__4, Q13__5, Q13__6, Q13__7, Q13__8, Q13__9, Q13__10, Q13__11, Q2__1, Q5__1, Q6__1, Q7__1, Q8__1, Q9__1, Q10__1, Q11__1, Q12__1]
  hyo: [Q4__1, Q5__1, Q6, Q7, Q13]

