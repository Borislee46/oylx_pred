[project]
name = "signals"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]
ignore = [
  "E203",
  "E501",
  "E402",
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
follow_imports = "silent"
exclude = [
    ".venv/",
    ".git/",
    "__pycache__/",
    ".mypy_cache/",
    "docs/",
    ".cursor",
]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --disable-warnings --import-mode=importlib"
markers = [
    "unit: fast isolated tests (<5s), no external dependencies",
    "integration: cross-module tests, may need Streamlit mock or real LLM",
    "api: HTTP endpoint tests (may need running server)",
    "data_quality: prediction quality gates (~25min), hard assertions against config thresholds",
    "stress: load and stability tests (~30min+)",
    "slow: any test taking >30s",
    "llm: tests that call real LLM APIs (slow + cost, run opt-in with -m llm)",
]
