<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* ── HK Style tokens (mirrored from 00_tokens.css + 30_controls.css) ── */
:root {
  --hk-font: "Noto Sans SC", "Inter", -apple-system, BlinkMacSystemFont,
             "Segoe UI", Roboto, sans-serif;
  --hk-text-size: 0.85rem;
  --hk-leading: 1.5;
  --hk-color-text: #475569;
  --hk-color-placeholder: rgba(71, 85, 105, 0.62);
  --hk-color-cyan: #06b6d4;
  --hk-color-cyan-dark: #0891b2;
  --hk-color-amber: #f59e0b;
  --hk-radius: 8px;
  --hk-space-x: 0.6rem;
  --hk-space-y: 0.4rem;
  --hk-transition: 0.25s ease;
  --hk-bg-top: rgba(255, 255, 255, 0.62);
  --hk-bg-bottom: rgba(255, 255, 255, 0.34);
  --hk-border-rest: rgba(255, 255, 255, 0.28);
  --hk-border-hover: rgba(6, 182, 212, 0.18);
  --hk-shadow-inset:
    inset 0 2px 6px rgba(15, 23, 42, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.72);
  --hk-shadow-rest: 0 1px 2px rgba(15, 23, 42, 0.06);
  --hk-shadow-focus:
    0 0 0 1px rgba(6, 182, 212, 0.3),
    inset 0 2px 6px rgba(15, 23, 42, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.8),
    0 2px 10px rgba(6, 182, 212, 0.08);
  --hk-ghost-color: rgba(6, 182, 212, 0.48);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--hk-font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.ghost-wrap {
  position: relative;
  width: 100%;
}

/* Hero textarea: clean white card + soft single-layer shadow.
   No glass blur, no gradient — Linear/Vercel quiet-confidence style. */
.ghost-backdrop {
  position: absolute;
  inset: 0;
  padding: 14px 16px 36px;
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow: hidden;
  pointer-events: none;
  font-family: var(--hk-font);
  font-size: 0.92rem;
  line-height: 1.55;
  letter-spacing: 0.005em;
  color: var(--hk-color-text);
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  box-shadow:
    0 1px 2px rgba(15, 23, 42, 0.04),
    0 12px 32px -8px rgba(15, 23, 42, 0.08);
  min-height: 132px;
  transition:
    border-color 0.18s ease,
    box-shadow 0.22s ease;
}

.ghost-suggestion {
  color: var(--hk-ghost-color);
  font-style: italic;
}

.ghost-textarea {
  position: relative;
  width: 100%;
  min-height: 132px;
  padding: 14px 16px 36px;
  font-family: var(--hk-font);
  font-size: 0.92rem;
  line-height: 1.55;
  letter-spacing: 0.005em;
  color: transparent;
  caret-color: var(--hk-color-cyan);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 12px;
  outline: none;
  resize: vertical;
  z-index: 2;
}

.ghost-wrap:hover .ghost-backdrop {
  border-color: #cbd5e1;
  box-shadow:
    0 1px 2px rgba(15, 23, 42, 0.04),
    0 16px 36px -8px rgba(15, 23, 42, 0.10);
}

.ghost-wrap:focus-within .ghost-backdrop {
  border-color: var(--hk-color-cyan);
  box-shadow:
    inset 0 0 0 1px rgba(6, 182, 212, 0.35),
    0 1px 2px rgba(15, 23, 42, 0.04),
    0 12px 32px -8px rgba(6, 182, 212, 0.14);
}

.ghost-textarea::placeholder {
  color: var(--hk-color-placeholder);
  opacity: 1;
  font-weight: 400;
  font-size: 0.92rem;
  letter-spacing: 0.005em;
}

/* ── Status: bottom-left inline, very compact ──────────────── */
.ghost-status {
  visibility: hidden;
  position: absolute;
  left: 16px;
  bottom: 11px;
  z-index: 4;
  font-family: var(--hk-font);
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--hk-color-placeholder);
  letter-spacing: 0.02em;
  pointer-events: none;
}

.ghost-status.loading {
  visibility: visible;
  color: var(--hk-color-cyan);
}

.ghost-status.loading::after {
  content: " ···";
  animation: dots 1.2s steps(4) infinite;
}

.ghost-status.rate-limited {
  visibility: visible;
  color: var(--hk-color-amber);
}

/* ── Accept hint: minimal text cue, teaches Tab shortcut ──── */
.ghost-accept-chip {
  display: none;
  align-items: center;
  padding: 2px 0;
  font-family: var(--hk-font);
  font-size: 0.68rem;
  font-weight: 500;
  color: rgba(6, 182, 212, 0.55);
  background: none;
  border: none;
  border-bottom: 1px dashed rgba(6, 182, 212, 0.25);
  cursor: pointer;
  user-select: none;
  transition: color 0.15s, border-color 0.15s;
  letter-spacing: 0.03em;
}
.ghost-accept-chip.visible {
  display: inline-flex;
}
.ghost-accept-chip:hover {
  color: var(--hk-color-cyan-dark);
  border-bottom-color: rgba(6, 182, 212, 0.55);
}
.ghost-accept-chip:active {
  transform: scale(0.96);
}

/* ── Analyze button: bottom-right inside textarea ─────────── */
.ghost-actions {
  position: absolute;
  right: 10px;
  bottom: 8px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ghost-analyze-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px 5px 9px;
  font-family: var(--hk-font);
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--hk-color-cyan-dark);
  background: transparent;
  border: 1px solid rgba(6, 182, 212, 0.22);
  border-radius: 7px;
  cursor: pointer;
  transition:
    background 0.15s ease,
    border-color 0.15s ease,
    color 0.15s ease,
    transform 0.12s ease;
}
.ghost-analyze-btn .ghost-spark {
  font-size: 0.78rem;
  line-height: 1;
  opacity: 0.7;
}
.ghost-analyze-btn:hover:not(:disabled) {
  color: #ffffff;
  background: var(--hk-color-cyan-dark);
  border-color: var(--hk-color-cyan-dark);
  transform: translateY(-1px);
}
.ghost-analyze-btn:active:not(:disabled) {
  transform: translateY(0) scale(0.97);
}
.ghost-analyze-btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}
.ghost-analyze-btn.loading {
  opacity: 1;
  color: var(--hk-color-amber);
  border-color: rgba(245, 158, 11, 0.3);
  background: transparent;
}
.ghost-analyze-btn.loading .ghost-spark {
  opacity: 1;
  animation: spark-pulse 0.7s ease-in-out infinite;
}
@keyframes spark-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.15); }
}

/* ── Loading dots: staggered CSS animation ────────────── */
.ghost-d {
  display: none;
  opacity: 0;
  font-weight: 400;
  color: currentColor;
}
.ghost-analyze-btn.loading .ghost-d {
  display: inline;
  animation: dot-breathe 1.2s ease-in-out infinite;
}
.ghost-analyze-btn.loading .ghost-d:nth-child(2) { animation-delay: 0s; }
.ghost-analyze-btn.loading .ghost-d:nth-child(3) { animation-delay: 0.2s; }
.ghost-analyze-btn.loading .ghost-d:nth-child(4) { animation-delay: 0.4s; }

@keyframes dot-breathe {
  0%, 100% { opacity: 0.15; }
  50%      { opacity: 1; }
}

@keyframes dots {
  0% { content: " ·"; }
  33% { content: " ··"; }
  66% { content: " ···"; }
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --hk-color-text: #cbd5e1;
    --hk-color-placeholder: rgba(148, 163, 184, 0.55);
  }
  .ghost-backdrop {
    background: #1e293b;
    border-color: #334155;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.2),
      0 12px 32px -8px rgba(0, 0, 0, 0.35);
  }
  .ghost-wrap:hover .ghost-backdrop {
    border-color: #475569;
  }
  .ghost-wrap:focus-within .ghost-backdrop {
    border-color: var(--hk-color-cyan);
    box-shadow:
      inset 0 0 0 1px rgba(6, 182, 212, 0.4),
      0 1px 2px rgba(0, 0, 0, 0.2),
      0 12px 32px -8px rgba(6, 182, 212, 0.18);
  }
}
</style>
</head>
<body>
<div class="ghost-wrap">
  <div class="ghost-backdrop" id="backdrop"></div>
  <textarea
    class="ghost-textarea"
    id="textarea"
    placeholder=""
    rows="4"
    spellcheck="false"
    aria-label="输入学生背景信息"
  ></textarea>
  <div class="ghost-status" id="status" aria-live="polite"></div>
  <div class="ghost-actions">
    <button class="ghost-accept-chip" id="acceptChip">Tab 接受</button>
    <button class="ghost-analyze-btn" id="analyzeBtn">
      <span class="ghost-spark" aria-hidden="true">✦</span>
      <span id="analyzeLabel">整理<span class="ghost-d">.</span><span class="ghost-d">.</span><span class="ghost-d">.</span></span>
    </button>
  </div>
</div>

<script>
// ── Streamlit bridge ─────────────────────────────────────────────────
let _streamlitEventSeq = 0;
function sendToStreamlit(value) {
  const payload = {
    ...value,
    event_id: _sessionId + ":" + (++_streamlitEventSeq),
  };
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: payload,
    dataType: "json"
  }, "*");
}

function setFrameHeight(height) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: height || document.documentElement.scrollHeight
  }, "*");
}

function setComponentReady() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
}

// ── DOM refs ─────────────────────────────────────────────────────────
const textarea = document.getElementById("textarea");
const backdrop = document.getElementById("backdrop");
const statusEl = document.getElementById("status");
const acceptChip = document.getElementById("acceptChip");
const analyzeBtn = document.getElementById("analyzeBtn");
const analyzeLabel = document.getElementById("analyzeLabel");

// ── Config (set by Python) ───────────────────────────────────────────
let apiKey = "";
let apiBaseUrl = "https://api.deepseek.com/beta";
let apiModel = "deepseek-v4-flash";
let currentSuggestion = "";
let _suggestionQueue = [];  // remaining segments, shown one at a time
let debounceTimer = null;
let isComposing = false;
let fetchController = null;
let lastRequest = "";

// ── Event logging / telemetry ────────────────────────────────────────
const _sessionId = Math.random().toString(36).slice(2, 10);
const _counters = {
  fetch_attempt: 0,     // doFetch() called
  fetch_ok: 0,          // API returned usable completion
  fetch_fail: 0,         // API error / timeout / empty
  fetch_retry: 0,       // second attempt succeeded
  cache_hit: 0,          // suggestion served from cache
  cache_set: 0,          // new entry written to cache
  suggestion_shown: 0,  // ghost text rendered
  suggestion_accepted: 0, // Tab pressed
  suggestion_dismissed: 0, // Esc / auto-dismiss
  rate_limited: 0,      // user hit rate limit
  dedup_blocked: 0,     // duplicate suggestion filtered
  rule_hit: 0,          // rule engine matched
  rule_miss: 0,         // rule engine no match
};
const _events = [];  // detailed event log (last 20)
let _phaseStart = Date.now();

function _log(action, detail) {
  const entry = { a: action, t: Date.now() - _phaseStart, d: detail || "" };
  _events.push(entry);
  if (_events.length > 20) _events.shift();
  if (action in _counters) _counters[action]++;
}

function _buildTelemetry() {
  return {
    session: _sessionId,
    duration_s: ((Date.now() - _phaseStart) / 1000).toFixed(0),
    counters: { ..._counters },
    recent: _events.slice(-10),
  };
}

// ── IME composition handling ─────────────────────────────────────────
textarea.addEventListener("compositionstart", () => { isComposing = true; });
textarea.addEventListener("compositionend", () => {
  isComposing = false;
  scheduleFetch();
});

// ── Input handler ────────────────────────────────────────────────────
textarea.addEventListener("input", () => {
  updateBackdrop();
  recordKeystroke();
  if (!isComposing) {
    scheduleFetch();
  }
});

// Re-check ghost on cursor move (arrow keys, click)
textarea.addEventListener("click", scheduleFetch);
textarea.addEventListener("keyup", (e) => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"].includes(e.key)) {
    scheduleFetch();
  }
});

// ── Keyboard: Tab accept, Esc dismiss ────────────────────────────────
textarea.addEventListener("keydown", (e) => {
  if ((e.key === "Tab" || e.key === "ArrowRight") && currentSuggestion) {
    e.preventDefault();
    acceptSuggestion();
    return;
  }
  if (e.key === "Escape" && currentSuggestion) {
    e.preventDefault();
    dismissSuggestion();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    triggerAnalyze();
    return;
  }
});

// ── Sync text to Streamlit for fallback actions ───────────────────────
let _lastSyncedText = "";
function syncTextToStreamlit() {
  const t = textarea.value;
  if (!t || t === _lastSyncedText) return;
  _lastSyncedText = t;
  sendToStreamlit({ text: t, action: "sync" });
}

// ── Blur: report final text + telemetry to Streamlit ──────────────────
let _suppressBlurUntil = 0;
textarea.addEventListener("blur", () => {
  if (Date.now() < _suppressBlurUntil) return;
  _lastSyncedText = textarea.value;
  sendToStreamlit({
    text: textarea.value,
    action: "blur",
    telemetry: _buildTelemetry(),
  });
});

// ── Resize sync ───────────────────────────────────────────────────────
new ResizeObserver(() => {
  backdrop.style.height = textarea.offsetHeight + "px";
  backdrop.style.width = textarea.offsetWidth + "px";
}).observe(textarea);

// ── Smart trigger state ────────────────────────────────────────────────
let keystrokeTimestamps = [];  // last 6 timestamps for speed calc

// Natural break points — user is likely to pause here, trigger fast.
// NOTE: comma / enumeration separators are deliberately excluded — users
// type them between items and don't want a suggestion firing mid-list.
const TRIGGER_END_RE = /(GPA|雅思|托福|GRE|GMAT|科研|实习|论文|获奖|目标|申请|一段|两段|二段|三段)\s*$/;
const SENTENCE_END_RE = /[。！？\n]\s*$/;
const KNOWN_FIELDS_RE = /(院校|学校|大学|专业|GPA|均分|雅思|托福|GRE|实习|科研|论文|获奖|目标)/g;

function typingSpeed() {
  // chars/sec based on recent keystrokes
  const now = keystrokeTimestamps;
  if (now.length < 2) return 0;
  const d = (now[now.length - 1] - now[0]) / 1000;
  return d > 0 ? (now.length - 1) / d : 999;
}

function recordKeystroke() {
  const now = Date.now();
  keystrokeTimestamps.push(now);
  if (keystrokeTimestamps.length > 6) keystrokeTimestamps.shift();
}

function adaptiveDebounce(text) {
  // Stop sign: sentence end
  if (SENTENCE_END_RE.test(text)) return -1;

  // Trigger word → near-instant
  if (TRIGGER_END_RE.test(text)) return 120;

  // Based on typing speed
  const speed = typingSpeed();
  if (speed > 3.5) return 150;   // flying → quick ghost to keep up
  if (speed > 1.5) return 280;   // normal pace
  return 450;                     // slow / paused → give time to think
}

// ── Debounced API fetch ──────────────────────────────────────────────
function scheduleFetch() {
  clearTimeout(debounceTimer);
  const text = textarea.value;

  // Sync text to Streamlit immediately on every keystroke pause
  // so "AI 整理信息" button always sees the latest text
  syncTextToStreamlit();

  // Only suggest when cursor is at the end
  if (!text || text.length < 2 || textarea.selectionStart !== text.length) {
    dismissSuggestion();
    return;
  }

  const delay = adaptiveDebounce(text);
  if (delay < 0) {
    dismissSuggestion();
    return;
  }

  debounceTimer = setTimeout(() => doFetch(text), delay);
}

// ── localStorage cache ─────────────────────────────────────────────────
const CACHE_PREFIX = "ghost_cache:";
const CACHE_MAX = 50;
const CACHE_TTL = 30 * 60 * 1000;  // 30 minutes

function _simpleHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(36);
}

function cacheGet(prefixText) {
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + _simpleHash(prefixText));
    if (!raw) return null;
    const entry = JSON.parse(raw);
    if (Date.now() - entry.ts > CACHE_TTL) {
      localStorage.removeItem(CACHE_PREFIX + _simpleHash(prefixText));
      return null;
    }
    return entry.completion;
  } catch (e) { return null; }
}

function cacheSet(prefixText, completion) {
  try {
    // LRU eviction: if over max, remove oldest
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(CACHE_PREFIX)) keys.push(k);
    }
    if (keys.length >= CACHE_MAX) {
      // Remove 10 oldest
      const sorted = keys.map(k => {
        try { return { k, ts: JSON.parse(localStorage.getItem(k)).ts }; }
        catch (e) { return { k, ts: 0 }; }
      }).sort((a, b) => a.ts - b.ts);
      for (let i = 0; i < Math.min(10, sorted.length); i++) {
        localStorage.removeItem(sorted[i].k);
      }
    }
    localStorage.setItem(
      CACHE_PREFIX + _simpleHash(prefixText),
      JSON.stringify({ completion, ts: Date.now() })
    );
  } catch (e) { /* quota exceeded, silently skip */ }
}

// ── Rate limiter: sliding window per session ─────────────────────────
let requestTimestamps = [];
let RATE_MAX = 30;
let RATE_WINDOW = 60000;
let RATE_COOLDOWN = 15000;
let rateLimitedUntil = 0;

function checkRateLimit() {
  const now = Date.now();
  if (now < rateLimitedUntil) return false;
  const cutoff = now - RATE_WINDOW;
  requestTimestamps = requestTimestamps.filter(t => t > cutoff);
  if (requestTimestamps.length >= RATE_MAX) {
    _log("rate_limited", "cooldown " + RATE_COOLDOWN / 1000 + "s");
    rateLimitedUntil = now + RATE_COOLDOWN;
    statusEl.textContent = "太快了，休息 15 秒...";
    statusEl.classList.add("rate-limited");
    setTimeout(() => {
      statusEl.classList.remove("rate-limited");
      statusEl.textContent = "";
    }, RATE_COOLDOWN);
    dismissSuggestion();
    return false;
  }
  requestTimestamps.push(now);
  return true;
}

// ── Dedup: don't show the same suggestion twice in a row ──────────────
let lastSuggestions = [];

function isDuplicateSuggestion(completion) {
  const clean = completion.trim();
  if (lastSuggestions.includes(clean)) return true;
  lastSuggestions.push(clean);
  if (lastSuggestions.length > 5) lastSuggestions.shift();
  return false;
}

// ── Domain vocabulary whitelist (positive signal). ──────────────────────
// Completion must contain at least one of these to pass quality filter.
// Forbidden regions (US/UK/etc.) are checked separately via _FORBIDDEN_REGIONS_RE.
const DOMAIN_SIGNALS_RE = /(大学|学院|学校|院校|专业|系|工程|科学|管理|经济|金融|计算机|数据|电子|机械|材料|化学|生物|医学|法律|教育|传媒|设计|艺术|建筑|数学|统计|物理|环境|GPA|均分|绩点|雅思|托福|GRE|GMAT|科研|实习|论文|获奖|项目|经历|实验室|导师|课程|排名|申请|录取|目标|冲刺|保底|一段|两段|二段|三段|一篇|两篇|港|香港|新加坡|NUS|NTU|HKU|CUHK|HKUST|CityU|PolyU)/;

// ── Blacklist: common nonsense completions ───────────────────────────
const NONSENSE_RE = /^[\s，,、。！？：；:;\d]+$/;         // only whitespace/punctuation/numbers
const AGE_RE = /岁|年龄|出生|生日|几岁|多大/;             // age-related
const CONTACT_RE = /电话|手机|微信|邮箱|QQ|地址|住|省|市/; // contact info
const POLITICAL_RE = /党|政府|政治|习|主席|领导人/;        // political

// ── Completion quality filter ────────────────────────────────────────
function isQualityCompletion(completion) {
  if (!completion) return false;
  if (NONSENSE_RE.test(completion)) return false;
  if (AGE_RE.test(completion)) return false;
  if (CONTACT_RE.test(completion)) return false;
  if (POLITICAL_RE.test(completion)) return false;
  // Reject completions mentioning non-supported regions
  if (_FORBIDDEN_REGIONS_RE.test(completion)) return false;

  const meaningful = completion.replace(/[，,、\s\.。！？：:；;]/g, "");
  if (meaningful.length < 2) return false;

  const text = textarea.value;
  // Reject if completion is already in the user's text
  if (completion.length >= 4 && text.includes(completion)) return false;

  // Must have at least one domain signal or be very short (1-3 char filler)
  if (completion.length >= 3 && !DOMAIN_SIGNALS_RE.test(completion)) {
    // Check if it looks like a numeric score (e.g. " 3.5", " 320")
    if (!/^\s*\d+\.?\d*\s*$/.test(completion)) {
      return false;
    }
  }

  return true;
}

// ── Rule Engine: instant completions for scores / counters ─────────────
// Only handles high-confidence deterministic completions (scores, counters).
// Schools, majors, and free-form background text → still go to LLM.
const POSTFIX_RULES = {
  "GPA":    [" 3.5", " 3.2", " 3.0", " 3.8", " 3.3", " 3.7", " 2.8"],
  "均分":   [" 85", " 80", " 88", " 82", " 78", " 90", " 83"],
  "雅思":   [" 7.0", " 6.5", " 6.0", " 7.5", " 5.5"],
  "托福":   [" 100", " 105", " 90", " 95", " 110", " 85"],
  "GRE":    [" 320", " 325", " 330", " 315"],
  "GMAT":   [" 700", " 680", " 720", " 650"],
  "一段":   [" 科研", " 实习"],
  "两段":   [" 科研", " 实习"],
  "二段":   [" 科研", " 实习"],
  "一篇":   [" 论文"],
};

function tryRules(text) {
  for (let len = 4; len >= 1; len--) {
    if (text.length < len) continue;
    const candidates = POSTFIX_RULES[text.slice(-len)];
    if (candidates && candidates.length > 0) return candidates[0];
  }
  return null;
}

// ── Fuzzy cache: walk backwards to shorter prefix matches ──────────────
function cacheGetFuzzy(prefixText) {
  const exact = cacheGet(prefixText);
  if (exact) return exact;
  let i = prefixText.length - 1;
  while (i >= 6) {
    if (/[，,、\s]/.test(prefixText[i])) {
      const shorter = prefixText.slice(0, i);
      const cached = cacheGet(shorter);
      if (cached) {
        const beyond = prefixText.slice(i).trimStart();
        if (cached.startsWith(beyond)) return cached.slice(beyond.length);
        return null;
      }
    }
    i--;
  }
  return null;
}

// ── API call with timeout, retry, cache ──────────────────────────────
async function doFetch(text) {
  if (text === lastRequest) return;

  // 1. Try cache (exact + fuzzy) — instant, 0 tokens
  const cached = cacheGetFuzzy(text);
  if (cached && isQualityCompletion(cached) && !isDuplicateSuggestion(cached)) {
    _log("cache_hit", text.slice(-20));
    if (textarea.value === text) {
      _enqueueSuggestion(cached);
      updateBackdrop();
    }
    // Still refresh from API in background but only if cache is stale (>5 min)
    const cacheEntry = JSON.parse(
      localStorage.getItem(CACHE_PREFIX + _simpleHash(text)) || "{}"
    );
    if (cacheEntry.ts && Date.now() - cacheEntry.ts < 5 * 60 * 1000) return;
  }

  // 2. Try rules — instant, 0 tokens. Only scores / counters / field names.
  //    Schools, majors, free-form text won't match here → fall through to API.
  if (!currentSuggestion) {
    const ruled = tryRules(text);
    if (ruled && isQualityCompletion(ruled)) {
      _log("rule_hit", text.slice(-20));
      if (textarea.value === text) {
        _enqueueSuggestion(ruled);
        updateBackdrop();
      }
      return;  // rule completions are definitive, skip API
    }
    _log("rule_miss", "…");
  }

  if (!checkRateLimit()) return;

  // Cancel previous request
  if (fetchController) fetchController.abort();
  fetchController = new AbortController();
  lastRequest = text;

  const prefixLen = text.length < 4 ? text.length : Math.min(6, Math.max(3, Math.floor(text.length / 6)));
  const prefix = text.slice(-prefixLen);
  const mt = text.length < 15 ? 16 : (text.length < 30 ? 24 : 32);
  const present = (text.match(KNOWN_FIELDS_RE) || []).length;
  const guide = present >= 4
    ? "，补充描述其他背景信息"
    : "，推断可能缺少的背景信息（院校、专业、GPA、语言成绩、科研、实习、论文、获奖、目标院校等）";

  statusEl.classList.add("loading");

  // Attempt API call with 1 retry on network failure
  let raw = null;
  let fetchMs = 0;
  for (let attempt = 0; attempt < 2; attempt++) {
    _log("fetch_attempt", "try" + (attempt + 1));
    const t0 = Date.now();
    try {
      // 8s timeout via AbortController
      const timeoutId = setTimeout(() => fetchController.abort(), 8000);

      const resp = await fetch(apiBaseUrl + "/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey,
        },
        body: JSON.stringify({
          model: apiModel,
          messages: [
            { role: "system", content: "你是留学申请背景填写助手。用户正在逐步输入学生背景信息。你需要预测用户接下来会输入什么文字。" +
              "核心规则：只输出预测文字，不要解释。补全应自然衔接用户已输入的文字。无法预测时输出空。" +
              "系统仅支持以下地区院校：" + (_allowedRegions.join("、") || "香港、新加坡、澳门、马来西亚") + "。" +
              "允许的院校：" + (_allowedUniversities.slice(0, 25).join("、") || "香港大学、香港中文大学...") + "。" +
              "严禁提及任何非以上地区的院校（如美国、英国、澳洲、加拿大等）。" +
              "补全内容可包括：院校名（仅限以上列表）、专业名、GPA/均分、雅思/托福/GRE/GMAT分数、科研/实习/论文/获奖经历、目标方向。" +
              "严禁输出年龄、生日、联系方式、家庭信息、政治内容。" + guide + "。" },
            { role: "user", content: text },
            { role: "assistant", content: prefix, prefix: true }
          ],
          max_tokens: mt,
          temperature: 0.2,
          stop: ["\n", "。", "；", "！"]
        }),
        signal: fetchController.signal,
      });

      clearTimeout(timeoutId);
      fetchMs = Date.now() - t0;

      if (!resp.ok) {
        if (resp.status >= 500 && attempt === 0) {
          _log("fetch_retry", "HTTP " + resp.status);
          continue;  // server error → retry
        }
        _log("fetch_fail", "HTTP " + resp.status);
        throw new Error("HTTP " + resp.status);
      }

      const data = await resp.json();
      raw = (data.choices?.[0]?.message?.content || "").trim();
      _log("fetch_ok", fetchMs + "ms " + raw.slice(0, 15));
      if (attempt === 1) _log("fetch_retry", "saved");
      break;  // success
    } catch (err) {
      fetchMs = Date.now() - t0;
      if (err.name === "AbortError") {
        _log("fetch_fail", "timeout " + fetchMs + "ms");
        break;
      }
      if (attempt === 0 && err.message.includes("fetch")) {
        _log("fetch_retry", "network");
        await new Promise(r => setTimeout(r, 600));
        continue;
      }
      _log("fetch_fail", err.message.slice(0, 40));
      break;
    }
  }

  statusEl.classList.remove("loading");

  // 2. Cache + show result
  if (raw && isQualityCompletion(raw)) {
    if (isDuplicateSuggestion(raw)) {
      _log("dedup_blocked", raw.slice(0, 15));
    } else {
      _log("cache_set", text.slice(-20) + " → " + raw.slice(0, 15));
      cacheSet(text, raw);
      if (textarea.value === text) {
        _enqueueSuggestion(raw);
        updateBackdrop();
      }
    }
  } else if (textarea.value === text && !raw) {
    // API failed — try cache again as fallback
    const fallback = cacheGet(text);
    if (fallback && isQualityCompletion(fallback)) {
      _log("cache_hit", "fallback " + text.slice(-20));
      _enqueueSuggestion(fallback);
      updateBackdrop();
    } else {
      dismissSuggestion();
    }
  } else if (textarea.value === text) {
    dismissSuggestion();
  }
}

// ── Segmented suggestion queue ──────────────────────────────────────────
// Long completions are split by spaces and revealed one segment at a time.
// User controls the pace: Tab accepts current segment, next one appears.
function _enqueueSuggestion(suggestion) {
  if (!suggestion) { _suggestionQueue = []; return; }
  // Split keeping leading space on each chunk
  const parts = suggestion.split(/(?= )/);
  _suggestionQueue = parts.filter(p => p.trim());
  currentSuggestion = _suggestionQueue.length > 0 ? _suggestionQueue[0] : "";
}
function _advanceSegment() {
  _suggestionQueue.shift();
  currentSuggestion = _suggestionQueue.length > 0 ? _suggestionQueue[0] : "";
}

// ── Ghost text rendering ─────────────────────────────────────────────
function updateBackdrop() {
  const text = textarea.value;
  const suggestion = currentSuggestion;

  // Escape HTML
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  if (suggestion) {
    if (!backdrop.querySelector(".ghost-suggestion")) _log("suggestion_shown", suggestion.slice(0, 20));
    backdrop.innerHTML = esc(text) + '<span class="ghost-suggestion">' + esc(suggestion) + "</span>";
    acceptChip.classList.add("visible");
  } else {
    backdrop.textContent = text;
    acceptChip.classList.remove("visible");
  }

  // Sync scroll
  backdrop.scrollTop = textarea.scrollTop;
  backdrop.scrollLeft = textarea.scrollLeft;
  setFrameHeight();
}

textarea.addEventListener("scroll", () => {
  backdrop.scrollTop = textarea.scrollTop;
  backdrop.scrollLeft = textarea.scrollLeft;
});

// ── Accept / dismiss ─────────────────────────────────────────────────
function acceptSuggestion() {
  if (!currentSuggestion) return;
  _log("suggestion_accepted", currentSuggestion.slice(0, 20));
  textarea.value += currentSuggestion;
  _advanceSegment();  // show next segment, or "" if queue exhausted
  updateBackdrop();
  sendToStreamlit({
    text: textarea.value,
    action: "accept",
    telemetry: _buildTelemetry(),
  });
  textarea.focus();
  // Only re-fetch if queue is done — otherwise let user Tab through remaining
  if (!currentSuggestion) scheduleFetch();
}

function dismissSuggestion() {
  if (currentSuggestion) {
    _log("suggestion_dismissed", currentSuggestion.slice(0, 20));
  }
  _suggestionQueue = [];
  currentSuggestion = "";
  updateBackdrop();
  statusEl.classList.remove("loading");
}

// ── Init: read config from Streamlit render event ─────────────────────
let _hasInit = false;
let _allowedUniversities = [];
let _allowedRegions = [];
let _FORBIDDEN_REGIONS_RE = /(美国|英国|澳洲|澳大利亚|加拿大|日本|韩国|欧洲|德国|法国|意大利|瑞士|荷兰|瑞典|挪威|丹麦|芬兰|US|UK|USA|Australia|Canada|Europe)/i;

function init(cfg) {
  cfg = cfg || {};
  apiKey = cfg.api_key || "";
  apiBaseUrl = cfg.api_base_url || "https://api.deepseek.com/beta";
  apiModel = cfg.api_model || "deepseek-v4-flash";
  RATE_MAX = cfg.rate_max || 30;
  RATE_WINDOW = cfg.rate_window_ms || 60000;
  RATE_COOLDOWN = cfg.rate_cooldown_ms || 15000;
  _allowedUniversities = cfg.allowed_universities || [];
  _allowedRegions = cfg.allowed_regions || [];

  if (_hasInit) {
    analyzeBtn.disabled = false;
    analyzeBtn.classList.remove("loading");
    _analyzeLocked = false;
    setFrameHeight(cfg.height);
    return;
  }
  _hasInit = true;

  const initialText = cfg.initial_text || "";
  const placeholder = cfg.placeholder ?? "";

  textarea.value = initialText;
  textarea.placeholder = placeholder;
  textarea.rows = cfg.rows || 4;

  // Clean expired cache entries on load
  try {
    const now = Date.now();
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(CACHE_PREFIX)) {
        try {
          const entry = JSON.parse(localStorage.getItem(k));
          if (now - entry.ts > CACHE_TTL) toRemove.push(k);
        } catch (e) { toRemove.push(k); }
      }
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  } catch (e) { /* ignore */ }

  // If initialText is non-empty, pre-fetch a suggestion
  if (initialText && initialText.length >= 2) {
    setTimeout(() => scheduleFetch(), 200);
  }

  updateBackdrop();
  // Use actual content height so the button is never clipped
  setTimeout(() => setFrameHeight(), 50);
}

// ── Accept chip click handler ───────────────────────────────────────
acceptChip.addEventListener("click", () => {
  if (currentSuggestion) acceptSuggestion();
});

// ── Analyze button handler ───────────────────────────────────────────
let _analyzeLocked = false;

function triggerAnalyze() {
  if (_analyzeLocked) return;
  const text = textarea.value.trim();
  if (!text) {
    statusEl.textContent = "请先输入学生背景信息";
    statusEl.classList.add("rate-limited");
    setTimeout(() => {
      statusEl.classList.remove("rate-limited");
      statusEl.textContent = "";
    }, 2000);
    return;
  }
  _suppressBlurUntil = Date.now() + 300;
  _analyzeLocked = true;
  analyzeBtn.disabled = true;
  analyzeBtn.classList.add("loading");
  sendToStreamlit({
    text: text,
    action: "analyze",
    telemetry: _buildTelemetry(),
  });
  // Safety fallback — Streamlit re-render resets via init()
  setTimeout(() => {
    analyzeBtn.disabled = false;
    analyzeBtn.classList.remove("loading");
    _analyzeLocked = false;
  }, 8000);
}
analyzeBtn.addEventListener("click", triggerAnalyze);

window.addEventListener("message", (event) => {
  const data = event.data || {};
  if (data.type !== "streamlit:render") return;
  init((data.args && data.args.config) || {});
});

function boot() {
  setComponentReady();
  if (window.__GHOST_CONFIG__) init(window.__GHOST_CONFIG__);
  setFrameHeight();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
</html>
